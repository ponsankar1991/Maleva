# Registers the fonts the printed documents use (see fonts/maleva-fonts.xml).
# JasperReports finds this file on the classpath by name, so no code needs to
# load it; without it a template asking for "Verdana" silently falls back to a
# built-in font and prints thinner than the Crystal original.
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.maleva=fonts/maleva-fonts.xml
