spring:
  application:
    name: Maleva Production
  jackson:
    time-zone: Asia/Kuala_Lumpur
    date-format: dd/MM/yyyy
  autoconfigure:
    exclude:
  # Disable Spring Boot Docker Compose dev-services so the app runs standalone
  docker:
    compose:
      enabled: false
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: ${SPRING_REDIS_TIMEOUT:3000ms}
    client-type: lettuce
    lettuce:
      pool:
        max-active: 30            # PRODUCTION: Higher for production loads
        max-idle: 15              # PRODUCTION: Maintain more connections
        min-idle: 10              # PRODUCTION: Robust minimum
        max-wait: 3000ms          # PRODUCTION: More wait time
        time-between-eviction-runs: 60000ms
      shutdown-timeout: 5000ms    # PRODUCTION: More graceful shutdown
  session:
    store-type: redis
    timeout: ${SPRING_SESSION_TIMEOUT:3600}  # PRODUCTION: 60 minutes
    redis:
      namespace: maleva:session:prod  # PRODUCTION: Separate namespace
      flush-mode: on_save
  datasource:
    # Default JDBC URL includes encrypt=true and trustServerCertificate=true to avoid SSL certificate path errors
    # For production, prefer to set trustServerCertificate=false and import the server certificate into the JVM truststore
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://103.215.139.8:1433;databaseName=LiveMaleva2;encrypt=true;trustServerCertificate=true;loginTimeout=30;socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Kassamy@123}
    hikari:
      maximum-pool-size: 40          # PRODUCTION: Increased for production loads
      minimum-idle: 10               # PRODUCTION: Maintain robust pool
      idle-timeout: 900000           # PRODUCTION: 15 min
      max-lifetime: 1800000          # PRODUCTION: 30 min
      connection-timeout: 60000      # 60 seconds
      keepalive-time: 120000         # 2 minutes
      leak-detection-threshold: 120000
      connection-test-query: SELECT 1
      pool-name: MalevaHikariPool-PROD
      validation-timeout: 10000
      connection-init-sql: SET NOCOUNT ON
      # MUST stay false. hibernate.connection.provider_disables_autocommit=true below
      # promises Hibernate that the pool hands out connections with autocommit already
      # off, so Hibernate never calls setAutoCommit(false) itself. With this set to true
      # that promise is broken: every statement self-commits, @Transactional stops being
      # atomic, and rollback throws "Unable to rollback against JDBC Connection" -
      # which replaces the real exception and turns every 400 into a 500.
      auto-commit: false
  jpa:
    open-in-view: false              # Critical - prevent connection exhaustion in APIs
    show-sql: false                  # Disable SQL logging in production
    hibernate:
      ddl-auto: none
    # Explicit Spring Boot alias for the physical naming strategy to use annotated names verbatim
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # Also provide the direct property (redundant but explicit)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        format_sql: false
        jdbc:
          batch_size: 25             # Optimized batch size for SQL Server
          batch_versioned_data: true # Enable versioned data for better concurrency
        order_inserts: true          # Optimize batch inserts
        order_updates: true          # Optimize batch updates
        cache:
          use_second_level_cache: false # Disable unless you need it
        connection:
          provider_disables_autocommit: true

server:
  port: 8082
  servlet:
