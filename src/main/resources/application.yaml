spring:
  application:
    name: Maleva
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  # Disable Spring Boot Docker Compose dev-services so the app runs standalone
  docker:
    compose:
      enabled: false
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
  session:
    # Disable Redis-backed HTTP session store so the application doesn't fail when Redis is unreachable
    store-type: none
  datasource:
    # Default JDBC URL includes encrypt=true and trustServerCertificate=true to avoid SSL certificate path errors
    # For production, prefer to set trustServerCertificate=false and import the server certificate into the JVM truststore
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://103.215.139.8:1433;databaseName=LiveMaleva2;encrypt=true;trustServerCertificate=true;loginTimeout=30;socketTimeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Kassamy@123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 30          # INCREASED from 20 to handle more concurrent requests
      minimum-idle: 8                # INCREASED from 5 to maintain better pool
      idle-timeout: 600000           # INCREASED to 10 min - prevent aggressive connection closure
      max-lifetime: 1800000          # INCREASED to 30 min - recycle connections less frequently
      connection-timeout: 60000      # INCREASED from 30 to 60 sec - more time to acquire connection
      keepalive-time: 120000         # INCREASED from 60 to 120 sec - better firewall persistence
      leak-detection-threshold: 120000 # DOUBLED - detect connection leaks earlier
      connection-test-query: SELECT 1 # Validate connection before use
      pool-name: MalevaHikariPool    # Easier to identify in logs/monitoring
      validation-timeout: 10000      # INCREASED from 5 to 10 sec - more time for validation
      connection-init-sql: SET NOCOUNT ON # Prevent extra result set from counting rows
      auto-commit: true              # Ensure autocommit is enabled
  jpa:
    open-in-view: false              # Critical - prevent connection exhaustion in APIs
    show-sql: false                  # Disable SQL logging in production
    hibernate:
      ddl-auto: none
    # Explicit Spring Boot alias for the physical naming strategy to use annotated names verbatim
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # Also provide the direct property (redundant but explicit)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        format_sql: false
        jdbc:
          batch_size: 25             # Optimized batch size for SQL Server
          batch_versioned_data: true # Enable versioned data for better concurrency
        order_inserts: true          # Optimize batch inserts
        order_updates: true          # Optimize batch updates
        cache:
          use_second_level_cache: false # Disable unless you need it
        connection:
          provider_disables_autocommit: true

server:
  port: 8082
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

logging:
  level:
    org.hibernate.SQL: INFO           # Changed from DEBUG to reduce logging overhead
    org.hibernate.type.descriptor.sql.BasicBinder: WARN  # Reduced from TRACE
    com.zaxxer.hikari: INFO           # Monitor connection pool

file:
  upload:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    max-file-size: ${FILE_MAX_SIZE:10485760}
    max-files: ${FILE_MAX_FILES:10}

jwt:
  secret: changeit
  expiration: 3600
  session-max-age: 28800
security:
  password-encoding:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: my.maleva.api
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true



qne:
  enabled: true
  demo: false
  view: false
  report-view: true

  base-url: https://api.qne.cloud/api

  db:
    trial: OUCMLM_TRIAL_V1
    live: OUCMLM

  control-codes:
    customer: 700-0000
    supplier: 800-2000

